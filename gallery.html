<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100E">
<title>Etkinlik Galerisi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;800&display=swap">
<style>
:root{--ink:#12100E;--ink2:#1B1714;--line:rgba(243,237,228,.14);--paper:#F6F0E6;--text:#F3EDE4;--muted:#A79688;--amber:#F2A93B;
  --disp:"Instrument Serif",Georgia,serif;--ui:"Figtree",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--ui)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;padding:26px 10px 20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{font-family:var(--disp);letter-spacing:.34em;font-size:15px;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--disp);font-style:italic;font-weight:400;font-size:clamp(30px,6vw,52px);margin:10px 0 6px;color:var(--paper)}
.cnt{color:var(--muted);font-size:14px;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid a{display:block;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--ink2);aspect-ratio:1/1}
.grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.grid a:hover img{transform:scale(1.04)}
.state{padding:70px 20px;text-align:center;color:var(--muted);font-size:16px;line-height:1.7}
.state b{color:var(--paper);font-weight:600}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--amber);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lb{position:fixed;inset:0;background:rgba(10,8,7,.94);display:none;z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:74vh;border-radius:10px;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.lbBar{display:flex;gap:12px;margin-top:18px;align-items:center}
.btn{font-family:var(--ui);font-weight:600;font-size:15px;padding:12px 22px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
.btn.gold{background:var(--amber);border-color:var(--amber);color:#171310}
.nav{position:fixed;top:50%;transform:translateY(-50%);font-size:34px;color:var(--paper);background:rgba(27,23,20,.6);
  border:1px solid var(--line);width:52px;height:52px;border-radius:50%;cursor:pointer;line-height:48px;text-align:center;user-select:none}
#prev{left:12px}#next{right:12px}
footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-top:46px;font-family:var(--disp)}
@media(max-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">OBSKURA</div>
    <h1 id="evName">Etkinlik Galerisi</h1>
    <div class="cnt" id="cnt"></div>
  </header>
  <div class="state" id="state"><div class="spin"></div>Galeri yükleniyor…</div>
  <div class="grid" id="grid"></div>
  <footer>Anı burada kalır</footer>
</div>
<div class="lb" id="lb">
  <div class="nav" id="prev">‹</div>
  <img id="lbImg" alt="">
  <div class="nav" id="next">›</div>
  <div class="lbBar">
    <a class="btn gold" id="dl" download>İndir</a>
    <button class="btn" id="close">Kapat</button>
  </div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var c=(q.get("c")||"").trim(),e=(q.get("e")||"").trim(),n=(q.get("n")||"").trim();
  var st=document.getElementById("state"),grid=document.getElementById("grid"),cnt=document.getElementById("cnt");
  if(n)document.getElementById("evName").textContent=n;
  document.title=(n?n+" — ":"")+"Etkinlik Galerisi";
  function fail(html){st.innerHTML=html;st.style.display="block"}
  if(!c||!e){fail("Galeri adresi eksik görünüyor.<br>Lütfen size gönderilen linkin tamamını kullanın.");return}
  var base="https://res.cloudinary.com/"+encodeURIComponent(c)+"/image/";
  var items=[],cur=0;
  function full(r){return base+"upload/q_auto:good/v"+r.version+"/"+r.public_id+"."+(r.format||"jpg")}
  function thumb(r){return base+"upload/c_fill,g_auto,w_500,h_500,q_auto/v"+r.version+"/"+r.public_id+"."+(r.format||"jpg")}
  function dlUrl(r,i){return base+"upload/fl_attachment:obskura-"+(i+1)+"/v"+r.version+"/"+r.public_id+"."+(r.format||"jpg")}
  var lb=document.getElementById("lb"),lbImg=document.getElementById("lbImg"),dl=document.getElementById("dl");
  function show(i){
    if(!items.length)return;
    cur=(i+items.length)%items.length;
    lbImg.src=full(items[cur]);dl.href=dlUrl(items[cur],cur);
    lb.classList.add("on");
  }
  document.getElementById("close").onclick=function(){lb.classList.remove("on")};
  document.getElementById("prev").onclick=function(ev){ev.stopPropagation();show(cur-1)};
  document.getElementById("next").onclick=function(ev){ev.stopPropagation();show(cur+1)};
  lb.addEventListener("click",function(ev){if(ev.target===lb)lb.classList.remove("on")});
  document.addEventListener("keydown",function(ev){
    if(!lb.classList.contains("on"))return;
    if(ev.key==="Escape")lb.classList.remove("on");
    if(ev.key==="ArrowLeft")show(cur-1);
    if(ev.key==="ArrowRight")show(cur+1);
  });
  fetch(base+"list/"+encodeURIComponent(e)+".json?t="+Date.now())
    .then(function(r){
      if(r.status===401||r.status===403)throw new Error("kapali");
      if(r.status===404)throw new Error("bos");
      if(!r.ok)throw new Error("hata "+r.status);
      return r.json();
    })
    .then(function(j){
      items=(j.resources||[]).slice().sort(function(a,b){return (a.version||0)-(b.version||0)});
      if(!items.length)throw new Error("bos");
      st.style.display="none";
      cnt.textContent=items.length+" kare";
      items.forEach(function(r,i){
        var a=document.createElement("a");a.href="#";
        var im=new Image();im.loading="lazy";im.src=thumb(r);im.alt="";
        a.appendChild(im);
        a.onclick=function(ev){ev.preventDefault();show(i)};
        grid.appendChild(a);
      });
    })
    .catch(function(err){
      if(err.message==="bos")fail("Bu etkinlikte henüz fotoğraf yok.<br>Çekimler başladığında kareler burada birikecek.");
      else if(err.message==="kapali")fail("<b>Galeri listesi şu an kapalı.</b><br>Kurulum notu: Cloudinary → Settings → Security bölümünde<br><b>\"Resource list\"</b> kısıtının kaldırılması gerekiyor.");
      else fail("Galeri şu an açılamadı.<br>Lütfen biraz sonra tekrar deneyin.");
    });
})();
</script>
</body>
</html>
