<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0807">
<title>Canlı Slayt</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;800&display=swap">
<style>
:root{--ink:#0A0807;--paper:#F6F0E6;--text:#F3EDE4;--muted:#9C8B7D;--amber:#F2A93B;
  --disp:"Instrument Serif",Georgia,serif;--ui:"Figtree",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--ui);overflow:hidden;cursor:none}
body.ui{cursor:auto}
#stage{position:fixed;inset:0}
#stage .fr{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
#stage .fr.on{opacity:1}
#stage .fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#stage .fr .blur{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(38px) brightness(.34) saturate(1.1);transform:scale(1.06)}
#stage .fr.kb img{animation:kb 15s ease-out forwards}
@keyframes kb{from{transform:scale(1.005)}to{transform:scale(1.055)}}
.vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
.top{position:fixed;top:0;left:0;right:0;padding:26px 34px;display:flex;align-items:center;gap:18px;
  background:linear-gradient(180deg,rgba(10,8,7,.82),rgba(10,8,7,0));pointer-events:none}
.top img.logo{height:54px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.top .t{font-family:var(--disp);font-style:italic;font-size:clamp(22px,2.7vw,40px);color:var(--paper);
  text-shadow:0 2px 16px rgba(0,0,0,.7);line-height:1.1}
.top .sub{font-family:var(--disp);letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-top:4px}
.bot{position:fixed;left:0;right:0;bottom:0;padding:18px 26px 20px;display:flex;align-items:flex-end;gap:20px;
  background:linear-gradient(0deg,rgba(10,8,7,.88),rgba(10,8,7,0))}
.strip{display:flex;gap:10px;flex:1;min-width:0;overflow:hidden}
.strip div{width:104px;height:104px;border-radius:10px;overflow:hidden;flex:0 0 auto;border:1px solid rgba(243,237,228,.16);
  background:#1B1714;opacity:.62;transition:opacity .3s,border-color .3s,transform .3s}
.strip div.now{opacity:1;border-color:var(--amber);transform:translateY(-4px)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.qr{flex:0 0 auto;text-align:center}
.qr canvas{background:var(--paper);border-radius:12px;padding:8px;display:block;width:118px;height:118px}
.qr span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:7px;font-family:var(--disp)}
.state{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px;gap:16px;background:var(--ink);z-index:9}
.state.off{display:none}
.state .big{font-family:var(--disp);font-style:italic;font-size:clamp(26px,4vw,46px);color:var(--paper)}
.state .sm{color:var(--muted);font-size:16px;line-height:1.75;max-width:640px}
.state .sm b{color:var(--paper);font-weight:600}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(243,237,228,.16);border-top-color:var(--amber);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:8;
  font-family:var(--disp);font-style:italic;font-size:clamp(20px,2.4vw,34px);color:var(--paper);
  background:rgba(10,8,7,.72);border:1px solid rgba(242,169,59,.5);border-radius:999px;padding:14px 34px;
  opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.flash.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.err{position:fixed;left:26px;bottom:150px;font-size:13px;color:var(--amber);background:rgba(10,8,7,.8);
  border:1px solid rgba(242,169,59,.35);border-radius:10px;padding:8px 14px;display:none}
.err.on{display:block}
@media(max-width:700px){.strip div{width:70px;height:70px}.qr canvas{width:88px;height:88px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="vig"></div>
<div class="top">
  <img class="logo" id="logo" alt="" style="display:none">
  <div><div class="t" id="evName">Etkinlik</div><div class="sub" id="brand">OBSKURA</div></div>
</div>
<div class="bot">
  <div class="strip" id="strip"></div>
  <div class="qr" id="qrBox" style="display:none"><canvas id="qr" width="236" height="236"></canvas><span>Tüm kareler</span></div>
</div>
<div class="flash" id="flash"></div>
<div class="err" id="err"></div>
<div class="state" id="state">
  <div class="spin"></div>
  <div class="big">Kareler yükleniyor</div>
  <div class="sm" id="stateSm">Birkaç saniye…</div>
</div>

<script src="qrmini.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var cloud=(q.get("c")||"").trim();
  var tag=(q.get("e")||"").trim();
  var ad=(q.get("n")||"").trim();
  var logo=(q.get("l")||"").trim();
  var marka=(q.get("b")||"OBSKURA").trim();
  var sure=Math.max(3,Math.min(30,parseInt(q.get("s")||"7",10)||7))*1000;   /* kare süresi */
  var tazele=Math.max(8,Math.min(120,parseInt(q.get("r")||"18",10)||18))*1000; /* liste tazeleme */
  var galeri=(q.get("g")||"").trim();

  var stage=document.getElementById("stage"),strip=document.getElementById("strip");
  var state=document.getElementById("state"),stateSm=document.getElementById("stateSm");
  var flash=document.getElementById("flash"),errEl=document.getElementById("err");
  document.getElementById("evName").textContent=ad||"Etkinlik";
  document.getElementById("brand").textContent=marka;
  document.title=(ad?ad+" — ":"")+"Canlı Slayt";
  if(logo){var lg=document.getElementById("logo");lg.src=logo;lg.style.display="block";
    lg.onerror=function(){lg.style.display="none"}}

  function bilgi(baslik,alt){
    state.classList.remove("off");
    state.querySelector(".big").textContent=baslik;
    stateSm.innerHTML=alt;
    state.querySelector(".spin").style.display=/yükleniyor|bekleniyor/i.test(baslik)?"block":"none";
  }
  function hata(msg){errEl.textContent=msg;errEl.classList.add("on");
    clearTimeout(errEl._t);errEl._t=setTimeout(function(){errEl.classList.remove("on")},9000)}

  if(!cloud||!tag){
    bilgi("Slayt adresi eksik","Panelden üretilen linkin tamamını kullan.<br>Adreste <b>c</b> ve <b>e</b> bölümleri olmalı.");
    return;
  }

  var base="https://res.cloudinary.com/"+encodeURIComponent(cloud)+"/image/";
  function buyuk(r){return base+"upload/c_limit,w_1920,h_1920,q_auto:good/v"+r.version+"/"+r.public_id+"."+(r.format||"jpg")}
  function kucuk(r){return base+"upload/c_fill,g_auto,w_240,h_240,q_auto/v"+r.version+"/"+r.public_id+"."+(r.format||"jpg")}
  function anahtar(r){return r.public_id+"@"+r.version}

  /* --- galeri QR --- */
  if(galeri&&window.QRMini){
    try{
      var cv=document.getElementById("qr");
      window.QRMini.draw(cv,galeri,"#12100E","#F6F0E6");
      document.getElementById("qrBox").style.display="block";
    }catch(e){}
  }

  var kayitlar=[],gorulen={},sira=[],idx=-1,ilkYukleme=true,suAn=null,yeniKuyruk=[];

  function stripCiz(){
    var son=sira.slice(-9);
    strip.innerHTML="";
    son.forEach(function(r){
      var d=document.createElement("div");
      if(suAn&&anahtar(r)===anahtar(suAn))d.className="now";
      var im=new Image();im.src=kucuk(r);im.alt="";im.onerror=function(){d.style.display="none"};
      d.appendChild(im);strip.appendChild(d);
    });
  }

  function goster(r,yeniMi){
    suAn=r;
    var fr=document.createElement("div");fr.className="fr kb";
    var bl=new Image();bl.className="blur";bl.src=buyuk(r);bl.alt="";
    var im=new Image();im.src=buyuk(r);im.alt="";
    fr.appendChild(bl);fr.appendChild(im);
    var goster2=function(){
      stage.appendChild(fr);
      requestAnimationFrame(function(){requestAnimationFrame(function(){fr.classList.add("on")})});
      /* eskiyi temizle */
      setTimeout(function(){
        while(stage.children.length>2)stage.removeChild(stage.firstChild);
      },1300);
      state.classList.add("off");
      stripCiz();
      if(yeniMi){
        flash.textContent="Yeni kare geldi";
        flash.classList.add("on");
        setTimeout(function(){flash.classList.remove("on")},2200);
      }
    };
    if(im.decode)im.decode().then(goster2).catch(goster2); else {im.onload=goster2;im.onerror=goster2;}
  }

  function sonraki(){
    if(!sira.length)return;
    if(yeniKuyruk.length){          /* yeni gelen kare sıraya girmeden hemen gösterilir */
      var r=yeniKuyruk.shift();
      goster(r,true);
      return;
    }
    idx=(idx+1)%sira.length;
    goster(sira[idx],false);
  }

  function listeyiAl(){
    return fetch(base+"list/"+encodeURIComponent(tag)+".json?t="+Date.now(),{cache:"no-store"})
      .then(function(r){
        if(r.status===401||r.status===403)throw new Error("kapali");
        if(r.status===404)throw new Error("bos");
        if(!r.ok)throw new Error("kod"+r.status);
        return r.json();
      })
      .then(function(j){
        var liste=(j.resources||[]).slice().sort(function(a,b){return (a.version||0)-(b.version||0)});
        if(!liste.length)throw new Error("bos");
        var yeniler=[];
        liste.forEach(function(r){
          var k=anahtar(r);
          if(!gorulen[k]){gorulen[k]=1;sira.push(r);if(!ilkYukleme)yeniler.push(r);}
        });
        kayitlar=liste;
        if(yeniler.length)yeniKuyruk=yeniKuyruk.concat(yeniler.slice(-4));
        if(ilkYukleme){
          ilkYukleme=false;
          idx=Math.max(-1,sira.length-2);
          sonraki();
          setInterval(sonraki,sure);
        }
        errEl.classList.remove("on");
      });
  }

  function dongu(){
    listeyiAl().catch(function(e){
      if(e.message==="bos"){
        if(ilkYukleme)bilgi("İlk kare bekleniyor","Kabin çalışmaya başlayınca kareler burada anlık akacak.");
      }else if(e.message==="kapali"){
        /* slayt başladıysa ekranı ASLA kaplama — TV'de kareler dönmeye devam etsin */
        if(ilkYukleme)bilgi("Galeri listesi kapalı","Cloudinary → Settings → Security bölümünde<br><b>\"Resource list\"</b> kısıtının kaldırılması gerekiyor.<br>Bu açılmadan canlı slayt çalışmaz.");
        else hata("Galeri listesi kapandı — eldeki kareler dönmeye devam ediyor");
      }else if(ilkYukleme){
        bilgi("Bağlanılamadı","İnternet bağlantısını kontrol et.<br>Bağlantı gelince slayt kendi kendine başlar.");
      }else{
        hata("Liste tazelenemedi — eldeki kareler dönmeye devam ediyor");
      }
    });
  }
  dongu();
  setInterval(dongu,tazele);

  /* ekran uyumasın */
  (function(){
    var wl=null;
    function al(){ if(!("wakeLock" in navigator))return;
      navigator.wakeLock.request("screen").then(function(s){wl=s;s.addEventListener("release",function(){wl=null})}).catch(function(){}); }
    al();
    document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!wl)al()});
  })();

  /* fare oynayınca imleç görünsün (operatör müdahalesi) */
  var ct=null;
  document.addEventListener("mousemove",function(){
    document.body.classList.add("ui");clearTimeout(ct);
    ct=setTimeout(function(){document.body.classList.remove("ui")},2500);
  });
  /* boşluk: sonraki kare · F: tam ekran */
  document.addEventListener("keydown",function(e){
    if(e.key===" "){e.preventDefault();sonraki()}
    if(e.key==="f"||e.key==="F"){
      if(document.fullscreenElement)document.exitFullscreen();
      else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
    }
  });
})();
</script>
</body>
</html>
